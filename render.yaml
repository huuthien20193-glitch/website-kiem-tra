# Render Blueprint – tạo Web Service Node từ repo GitHub.
# Trên render.com: New + → Blueprint → chọn repo này → Approve.
services:
  - type: web
    name: website-kiem-tra
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
